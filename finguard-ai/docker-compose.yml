services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot training job: trains a model into the shared artifacts volume.
  trainer:
    build: ./ml
    volumes:
      - model_artifacts:/app/artifacts
      # Mount real PaySim here to train on it instead of synthetic data:
      # - ./ml/data/paysim.csv:/app/data/paysim.csv:ro
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-finguard}:${POSTGRES_PASSWORD:-finguard}@db:5432/${POSTGRES_DB:-finguard}
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - model_artifacts:/app/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  model_artifacts:
